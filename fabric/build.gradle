plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"

    implementation("net.conczin:immersive_aircraft:${immersive_aircraft_version}+fabric") {
        transitive = false
    }

    // Loom strips Immersive Aircraft's nested library from its development jar.
    localRuntime "org.mariuszgromada.math:MathParser.org-mXparser:${mxparser_version}"
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
            vmArg '-Xmx3G'
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
            programArg '--nogui'
            vmArg '-Xmx3G'
        }
    }
}
