plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
            gameDirectory = file("run/${it.name}")
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        man_of_many_planes {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("net.conczin:immersive_aircraft:${immersive_aircraft_version}+neoforge") {
        transitive = false
    }
}
