plugins {
    id "fabric-loom" version "${fabric_loom_version}" apply false
    id "net.neoforged.moddev" version "${neoforge_moddev_version}" apply false
}

def getAppVersion = { ->
    try {
        def tag = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
        }.standardOutput.asText.get().trim()
        if (tag.isEmpty()) {
            return rootProject.minecraft_version + "-SNAPSHOT"
        }
        return tag
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return rootProject.minecraft_version + "-DEV"
    }
}

allprojects {
    version = getAppVersion()
    group = rootProject.group_id
}
